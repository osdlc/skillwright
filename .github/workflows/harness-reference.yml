# Checks the harness reference bundle in harness-reference/: every concept
# validates, its links into this repository resolve, schema/*.json is current,
# and the tests, typecheck and page generator pass.
#
# The `paths` filter means this workflow does not run on every pull request,
# so it is not one to require in a ruleset.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: harness-reference

on:
  pull_request:
    paths:
      - 'harness-reference/**'
      - '.github/workflows/harness-reference.yml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'harness-reference/**'
      - '.github/workflows/harness-reference.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-reference-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate, test, typecheck and generate
        working-directory: harness-reference
        run: pnpm run check
