# Publishes harness-knowledge.json, the file tools look harness values up in, as assets of a
# GitHub release. A push to main that changes harness-reference/ compiles the corpus at that
# commit and releases the result under `harness-knowledge-<YYYYMMDD>-<shortsha>`, so every
# basis permalink in the file points at the commit the tag names.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: harness-knowledge

on:
  push:
    branches: [main]
    paths:
      - 'harness-reference/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harness-knowledge
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm --filter harness-reference run compile --strict --out "$RUNNER_TEMP/knowledge"

      # Idempotent: a rerun, or a run that died between creating and publishing, finishes the
      # same release. A release for the tag that was cut from another commit is an error.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d HEAD)"
          tag="harness-knowledge-${day}-$(git rev-parse --short=7 HEAD)"
          files=("$RUNNER_TEMP/knowledge/harness-knowledge.json" "$RUNNER_TEMP/knowledge/harness-knowledge.schema.json")
          if target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish 2>/dev/null)"; then
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::$tag exists for $target, not $GITHUB_SHA"
              exit 1
            fi
          else
            gh release create "$tag" --draft --latest=false --target "$GITHUB_SHA" \
              --title "Harness knowledge $tag" \
              --notes "Compiled from harness-reference/corpus at $GITHUB_SHA."
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          gh release edit "$tag" --draft=false --latest=false
