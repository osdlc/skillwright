[package]
name = "tradecraft-core"
version = "0.48.0"
edition.workspace = true
rust-version.workspace = true
description = "The Tradecraft core: model a vault of markdown skill notes, scan it, and publish or build each note into the on-disk formats of coding-agent tools, through a filesystem seam that also runs under WebAssembly."
license.workspace = true
repository.workspace = true
homepage = "https://github.com/osdlc/skillwright/tree/main/packages/rust/tradecraft-core"
readme = "README.md"
keywords = ["agent", "skills", "markdown", "claude", "codex"]
categories = ["development-tools", "filesystem"]
include = [
  "src/**/*.rs",
  "examples/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[dependencies]
serde = { workspace = true }
# `preserve_order`: a parsed JSON object (a hooks file, a plugin manifest)
# keeps its source order, so reports and rewritten files list entries as the
# author wrote them.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
# Compares path segments the way APFS does.
unicode-normalization = { workspace = true }
sha2 = { workspace = true }
# Per-runtime rendering: frontmatter dialects, tool-name translation, the
# per-target skills directory, annotations and peer resources.
agent-adapt = { workspace = true }
# BOM- and CRLF-tolerant frontmatter framing.
frontmatter-lossless = { workspace = true }
# Frontmatter field edits that keep every byte they do not touch.
yaml-splice = { workspace = true }
# The code fence and inline span lexer the compile and adopt passes share.
markdown-link = { workspace = true }
# The file-access trait (`crate::vfs`), shared with the osdlc vault crates.
# `native` for `NativeVfs`, which the CLI and the tests use.
vfs-seam = { workspace = true, features = ["native"] }
# The plain file walk for assets, scripts and bundles (`crate::walk`).
vfs-walk = { workspace = true }
# The vault walk and the vault's excluded files (`crate::walk`).
markdown-vault-fs = { workspace = true }
# Heading and block selection for a link fragment (`select`).
markdown-contract = { workspace = true }
# Symlink-aware containment checks, over the `Vfs` seam.
path-guard = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
