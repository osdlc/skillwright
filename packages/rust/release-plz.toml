# release-plz settings for the crates in this workspace.
# Reference: https://release-plz.dev/docs/config
#
# .github/workflows/release-plz.yml passes this file with the action's
# `config` input. release-plz only looks for it in the directory it runs in,
# which is the repository root.
#
# skillwright and tradecraft-core are released. The other two crates are not.
[workspace]
# Tags are `<crate>/vX.Y.Z`, the scheme these crates were tagged with in
# osdlc/osdlc before they moved here.
git_tag_name = "{{ package }}/v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"
git_release_enable = true
# `release` runs on every push to main and publishes each crate whose
# version is not on crates.io yet. The `crates-io` environment approval
# gates each publish. This is the default, set here so it is not changed by
# accident.
release_always = true
# cargo-semver-checks on each release PR. A crate with no published version
# is not checked.
semver_check = true
changelog_update = true
# The release PR's description. It leads with each crate's changelog section,
# which holds the hand-written Breaking and Fixed notes. cargo-semver-checks
# checks only the Rust API, so its column says "Rust API" and its full report
# is folded away at the end. A behaviour change it cannot see is listed under
# Breaking in the changelog. Tera 2 template; the variables are listed at
# https://release-plz.dev/docs/config#the-pr_body-field. If the description
# would pass GitHub's limit, release-plz drops `title` and `changelog`.
pr_body = """
## New release

| Crate | Version | Rust API (cargo-semver-checks) |
|---|---|---|
{%- for release in releases %}
| `{{ release.package }}` | {% if release.previous_version and release.previous_version != release.next_version %}{{ release.previous_version }} → {% endif %}{{ release.next_version }} | {% if release.semver_check == "incompatible" %}⚠ breaking{% elif release.semver_check == "compatible" %}compatible{% else %}not checked{% endif %} |
{%- endfor %}

cargo-semver-checks does not see behaviour changes. The **Breaking** section of each crate's CHANGELOG lists every breaking change, in the API and in behaviour.
{% for release in releases %}{% if release.title and release.changelog %}
## `{{ release.package }}` {{ release.title }}

{{ release.changelog }}
{% endif %}{% endfor %}
{%- for release in releases %}{% if release.breaking_changes %}
<details><summary>cargo-semver-checks report for <code>{{ release.package }}</code></summary>

```text
{{ release.breaking_changes }}
```

</details>
{% endif %}{% endfor %}
---
Opened by [release-plz](https://github.com/release-plz/release-plz/). The template is `pr_body` in `packages/rust/release-plz.toml`.
"""

# The wasm-bindgen wrapper over tradecraft-core, built for the npm package
# @osdlc/tradecraft-wasm. Never released as a crate. `publish = false` must
# match its Cargo.toml, or `release-plz release` stops with an error. It also
# keeps the crate out of the release pull request. `release = false` says the
# same explicitly: no version bump, changelog or tag.
[[package]]
name = "tradecraft-wasm"
publish = false
release = false

# A build tool that writes the TypeScript declarations for tradecraft-wasm.
# Never released as a crate.
[[package]]
name = "tradecraft-typegen"
publish = false
release = false

# The changelog's commit groups. These are release-plz's defaults (Keep a
# Changelog groups from conventional commit types), plus skips for commits
# that say nothing to a user of the crate: merges, release-plz's own release
# commits, the old wasm rebuild commits, CI changes and release-process docs. Setting
# `commit_parsers` replaces the defaults, so they are repeated here.
[changelog]
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^chore(\\(release\\))?: (release|rebuild the committed wasm)", skip = true },
  { message = "^(ci|CI)(\\(.*\\))?:", skip = true },
  { message = "^RELEASING\\.md:", skip = true },
  { message = "^feat", group = "added" },
  { message = "^changed", group = "changed" },
  { message = "^deprecated", group = "deprecated" },
  { message = "^removed", group = "removed" },
  { message = "^fix", group = "fixed" },
  { message = "^security", group = "security" },
  { message = ".*", group = "other" },
]
