[package]
name = "skillwright"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
description = "A command-line tool that builds a vault of markdown skill notes into a plugin marketplace for coding-agent tools (Claude Code, Codex, Cursor and Pi), and checks the built marketplace for drift."
license.workspace = true
repository.workspace = true
homepage = "https://github.com/osdlc/skillwright"
readme = "README.md"
keywords = ["agent", "skills", "markdown", "cli", "claude"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "src/**/*.rs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
  "!tests/fixtures/**",
]

[[bin]]
name = "skillwright"
path = "src/main.rs"

# `cargo binstall skillwright` downloads the bare binary that
# .github/workflows/skillwright-release.yml attaches to the GitHub Release.
# The asset name is release/product.ts releaseAssetName. On Linux, binstall falls
# back from the gnu target to the musl one, which is what ships.
[package.metadata.binstall]
pkg-url = "https://github.com/osdlc/skillwright/releases/download/skillwright/v{ version }/{ name }-{ version }-{ target }"
pkg-fmt = "bin"

[dependencies]
clap = { workspace = true }
# The UTC timestamp `bump` uses as a patch number.
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tradecraft-core = { workspace = true }
typed-git = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The golden tests hash the built tree.
sha2 = { workspace = true }

[lints]
workspace = true
